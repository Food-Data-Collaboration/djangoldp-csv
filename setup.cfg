[metadata]
name = djangoldp_csv
version = attr: djangoldp_csv.__version__
description = DjangoLDP package for importing RDF data from a CSV
long_description = file: README.md
author = StartinBlox
author_email = calum@startinblox.com
license = MIT
classifiers =
    Programming Language :: Python :: 3

[options]
packages = find:
install_requires =
    djangoldp~=5.1.1
include_package_data = true

[semantic_release]
version_source = tag
version_variable = djangoldp_csv/__init__.py:__version__
commit_parser = commit_parser.parse
